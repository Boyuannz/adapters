schema_version = "1.3"
source = "LoopsBench"

# Upstream copies the agent's /workspace verbatim into a fresh tester container.
# Harbor's artifact transfer filters .gitignore'd paths (e.g. build/) and resets
# mtimes, which forces from-scratch rebuilds that time out, so tests run in the
# agent container (shared mode) where /workspace is intact.

[task]
name = "loopsbench/{harbor_id}"
description = "LoopsBench long-horizon terminal task {upstream_id}"
authors = [
  { name = "Han Li" },
  { name = "Zhemin Fang" },
  { name = "Rili Feng" },
  { name = "Yingqi Zhao" },
  { name = "Jiaheng Liu" },
  { name = "Pengfei Gao" },
  { name = "He Ye" },
  { name = "Dayi Lin" },
  { name = "Qingwei Lin" },
  { name = "Saravan Rajmohan" },
  { name = "Dongmei Zhang" },
]
keywords = {keywords}

[metadata]
source = "LoopsBench"
upstream_task_id = "{upstream_id}"
upstream_bundle = "{bundle}"
difficulty = "{difficulty}"
category = "{category}"
tags = {tags}

[agent]
timeout_sec = {agent_timeout_sec}
network_mode = "allowlist"
allowed_hosts = []

[verifier]
timeout_sec = {verifier_timeout_sec}
environment_mode = "shared"
# Many run-tests.sh scripts install uv and pytest at test time.
network_mode = "public"

[environment]
network_mode = "public"
build_timeout_sec = {build_timeout_sec}
cpus = {cpus}
memory_mb = {memory_mb}
storage_mb = {storage_mb}
gpus = 0
